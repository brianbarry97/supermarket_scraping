version: 2

seeds:
  - name: supervalu_taxonomy
    description: Target SuperValu product taxonomy (levels 1-3) from the taxonomy consolidation project.
    columns:
      - name: taxonomy_1
        description: Top taxonomy level.
        data_tests: [not_null]
      - name: taxonomy_2
        description: Second taxonomy level.
      - name: taxonomy_3
        description: Third taxonomy level.
      - name: description
        description: Optional note on what belongs in the node.

  - name: supervalu_category_map
    description: Maps each SuperValu retailer category path (levels 1-4) to a taxonomy node, or marks it for dissolution.
    columns:
      - name: category_1
        description: Retailer category level 1.
      - name: category_2
        description: Retailer category level 2.
      - name: category_3
        description: Retailer category level 3.
      - name: category_4
        description: Retailer category level 4.
      - name: taxonomy_1
        description: Mapped taxonomy level 1.
      - name: taxonomy_2
        description: Mapped taxonomy level 2.
      - name: taxonomy_3
        description: Mapped taxonomy level 3.
      - name: disposition
        description: How the category is handled (map, dissolve, ...).
      - name: note
        description: Free-text rationale.

  - name: supervalu_product_overrides
    description: Product-level taxonomy overrides from LLM classification and manual review.
    columns:
      - name: id
        description: SuperValu product id.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('int_supervalu')
                field: id
              config:
                severity: warn
      - name: taxonomy_1
        description: Override taxonomy level 1.
      - name: taxonomy_2
        description: Override taxonomy level 2.
      - name: taxonomy_3
        description: Override taxonomy level 3.
      - name: source
        description: Origin of the override (llm, manual).
      - name: confidence
        description: Classifier confidence between 0 and 1.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: reviewed_at
        description: When a human reviewed the override; NULL if unreviewed.

  - name: own_brand_overrides
    description: >
      Per-retailer brand overrides for the own-brand flag (macros/own_brand.sql). is_own_brand = false lists a
      third-party brand at Aldi (Aldi is otherwise own brand for every brand); a row for Tesco corrects the
      Tesco rules (brand name, F&F, Tesco address). Brands are normalised (lowercase, no punctuation) as in
      the int_* models.
    data_tests:
      - unique_combination:
          arguments:
            columns: [supermarket, brand]
    columns:
      - name: supermarket
        description: Retailer the override applies to.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tesco', 'aldi']
      - name: brand
        description: Brand as produced by normalize_text in the int_* models.
        data_tests: [not_null]
      - name: is_own_brand
        description: The flag value to use for every product of this brand.
        data_tests: [not_null]
      - name: source
        description: Where the row came from (auto-derived from other retailers, or a manual decision).

  - name: brand_aliases
    description: >
      Reviewed brand aliases: alias_key is mapped to canonical_key by the brand_key column of the int_* models. Keys are
      brands with all spaces removed. One level only (a canonical key is never itself an alias); chains were resolved
      when the seed was built.
    columns:
      - name: alias_key
        description: Brand key (spaces removed) that is rewritten to canonical_key.
        data_tests: [unique, not_null]
      - name: canonical_key
        description: The brand key the alias resolves to.
        data_tests: [not_null]
      - name: alias_brand
        description: The alias as spelled by a retailer, for readability.
      - name: canonical_brand
        description: The canonical brand as spelled by a retailer, for readability.
      - name: source
        description: Where the row came from.
